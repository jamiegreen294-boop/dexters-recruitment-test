<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Customer Credit File</title><style>body{font-family:Arial;background:#f4f2ed;padding:20px}.card{background:white;border-radius:14px;padding:20px;max-width:700px;margin:auto;border:1px solid #ddd}input,textarea,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}button{background:#111;color:white;font-weight:bold}</style></head><body><div class="card"><h1>Customer Credit File</h1><label>Customer Name</label><input id="name"><label>Credit Limit</label><input id="limit" type="number"><label>Current Balance Owed</label><input id="owed" type="number"><label>Notes</label><textarea id="notes"></textarea><button onclick="save()">Save Credit File</button><h2>Transactions</h2><div id="history"></div></div><script>function save(){let d={name:name.value,limit:limit.value,owed:owed.value,notes:notes.value,time:new Date().toLocaleString()};localStorage.setItem('dexters-credit-file',JSON.stringify(d));render()}function render(){let d=JSON.parse(localStorage.getItem('dexters-credit-file')||'null');if(d){name.value=d.name;limit.value=d.limit;owed.value=d.owed;notes.value=d.notes;history.innerHTML='<p>Last updated: '+d.time+'</p>'}}render()</script></body></html>
