<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Candidate Portal TEST</title><style>
:root{--bg:#f4f2ed;--ink:#171717;--card:#fff;--muted:#6f6a63;--line:#ddd7cd;--gold:#d9b14c;--ok:#e8f5ec;--warn:#fff5d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}header{background:#101010;color:#fff;border-bottom:4px solid var(--gold)}.head{max-width:1000px;margin:auto;padding:20px 18px;display:flex;gap:16px;align-items:center}.logo{width:90px;height:66px;object-fit:contain;background:#fff;border-radius:9px;padding:4px}.wrap{max-width:1000px;margin:20px auto;padding:0 14px 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{display:inline-block;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#111;color:#fff}.secondary{background:#e9e4da;color:#111}.good{background:var(--ok);border:1px solid #b9d5c2;border-radius:10px;padding:12px}.warn{background:var(--warn);border:1px solid #e4c465;border-radius:10px;padding:12px}label{display:block;font-weight:700;margin:10px 0 5px}input{width:100%;padding:10px;border:1px solid #bdb7ad;border-radius:8px;font:inherit}.doc{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden;background:#fff}.doc summary{cursor:pointer;font-weight:900;padding:14px;background:#f6f3ed}.docbody{padding:16px}.signature{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}.signed{background:var(--ok);border:1px solid #b9d5c2;border-radius:8px;padding:10px;margin-top:8px}.locked{opacity:.65}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style><script src="recruitment-store.js"></script></head><body>
<header><div class="head"><img class="logo" src="https://raw.githubusercontent.com/jamiegreen294-boop/Dexters-loyalty-/main/dexters-logo.png"><div><h1>Dexter's Candidate Portal</h1><div>FULL CONNECTED TEST</div></div></div></header>
<div class="wrap"><div class="warn"><b>TEST ONLY.</b> This simulates secure candidate access. Do not enter real data.</div>
<div class="panel"><h2 id="hello">Candidate portal</h2><div id="loginStatus" class="good"></div>
<div id="portal" style="display:none">
<div class="grid"><div><label>Role</label><input id="role" readonly></div><div><label>Hours</label><input id="hours" readonly></div><div><label>Start</label><input id="start" readonly></div></div>
<p>Open each section to read the exact document snapshot that was issued to you. Each document is signed separately and timestamped.</p>
<div id="docs"></div>
<div class="nav"><button class="btn secondary" onclick="printSignedPack()">Print signed document pack</button><button class="btn secondary" onclick="downloadSignedPack()">Download signed document pack</button></div>
<div id="summary" class="good"></div>
</div></div>
</div>
<script>
const required=['offer','job','rota','privacy','starter','contract'];
function token(){return new URLSearchParams(location.search).get('token')||''}
function fmt(x){return x?new Date(x).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'medium'}):''}
function render(){
 const r=DexRecruit.load();
 if(token()!==r.candidatePortal.inviteToken){loginStatus.innerHTML='<b>Access denied.</b> This test portal requires the candidate-specific invitation token.';portal.style.display='none';return}
 r.candidatePortal.lastLoginAt=new Date().toISOString();DexRecruit.save(r);
 hello.textContent='Welcome, '+r.candidate.name;role.value=r.candidate.role;hours.value=r.candidate.hours;start.value=r.candidate.start;portal.style.display='block';
 loginStatus.innerHTML='<b>Candidate test login accepted.</b> Recruitment reference '+r.candidate.ref+'.';
 docs.innerHTML=required.map(k=>docBlock(k,r)).join('');
 const signed=required.filter(k=>r.documents[k]?.signed).length;
 summary.innerHTML='<b>Signing progress:</b> '+signed+' / 6 documents signed.'+(r.checks.complete?' Pre-employment checks are complete.':' Employment contract becomes available after manager checks are complete.');
}
function docBlock(k,r){
 const d=r.documents[k];
 const locked=k==='contract'&&!r.checks.complete;
 if(!d)return '<div class="doc locked"><div class="docbody"><b>'+title(k)+'</b><p>'+(k==='contract'?'Not available until the manager completes the required pre-employment checks.':'Not yet issued by Dexter\'s Recruitment Team.')+'</p></div></div>';
 const stamp=d.signed?'<div class="signed"><b>✓ Signed by '+d.signature+'</b><br>'+fmt(d.signedAt)+' • Version '+d.version+'</div>':'';
 return '<details class="doc" '+(k==='offer'?'open':'')+'><summary>'+d.title+(d.signed?' — Signed':' — Awaiting signature')+'</summary><div class="docbody">'+d.html+'<div class="signature"><label>Type your full legal name to sign this document</label><input id="sig_'+k+'" '+(d.signed?'disabled value="'+d.signature+'"':'')+'><button class="btn primary" '+(d.signed||locked?'disabled':'')+' onclick="signDoc(\''+k+'\')">Sign this document</button>'+stamp+'</div></div></details>'
}
function title(k){return({offer:'Conditional Offer Letter',job:'Job Description & Person Specification',rota:'4-Week Rota Pattern',privacy:'Recruitment Privacy Notice',starter:'New Starter Declaration',contract:'Employment Contract / Written Particulars'})[k]}
function signedPackHtml(){
 const r=DexRecruit.load();
 const items=required.filter(k=>r.documents[k]).map(k=>{const d=r.documents[k];return '<section style="page-break-after:always"><h1>'+d.title+'</h1>'+d.html+'<hr><p><b>Document version:</b> '+d.version+'<br><b>Status:</b> '+(d.signed?'Signed':'Unsigned')+(d.signed?'<br><b>Signed by:</b> '+d.signature+'<br><b>Signed at:</b> '+fmt(d.signedAt):'')+'</p></section>'}).join('');
 return '<!doctype html><html><head><meta charset="utf-8"><title>Dexter\'s Signed Recruitment Pack</title></head><body><h1>Dexter\'s Recruitment / Employment Document Pack</h1><p>'+r.candidate.name+' • '+r.candidate.ref+'</p>'+items+'</body></html>';
}
function printSignedPack(){const w=window.open('','_blank');if(!w)return;w.document.write(signedPackHtml());w.document.close();w.onload=()=>w.print()}
function downloadSignedPack(){const blob=new Blob([signedPackHtml()],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Dexters-Signed-Pack-'+DexRecruit.load().candidate.name.replace(/[^a-z0-9]+/gi,'-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function signDoc(k){
 const r=DexRecruit.load(),input=document.getElementById('sig_'+k),sig=(input?.value||'').trim();
 if(sig.toLowerCase()!==r.candidate.name.toLowerCase()){summary.innerHTML='<b>Signature not accepted.</b> Type your full legal name exactly as shown on your recruitment profile.';return}
 try{DexRecruit.sign(k,sig);const x=DexRecruit.load();if(required.slice(0,5).every(a=>x.documents[a]?.signed)&&!x.checks.complete)x.application.status='Offer documents signed — checks pending';if(required.every(a=>x.documents[a]?.signed)&&x.checks.complete)x.application.status='All documents signed — ready to appoint';DexRecruit.save(x);render()}catch(e){summary.innerHTML='<b>'+e.message+'</b>'}
}
render();
</script></body></html>
